name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Find project and build APK
        run: |
          FILE=$(find . -name settings.gradle | head -n 1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle repo mein nahi mili. Files upload nahi hui."
            ls -R | head -50
            exit 1
          fi
          cd "$(dirname "$FILE")"
          echo "Project folder: $(pwd)"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MilkmanPRO-apk
          path: '**/app-debug.apk'
